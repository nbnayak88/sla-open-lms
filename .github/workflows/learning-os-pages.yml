name: Publish LearningOS PRD
on:
  push:
    branches: [main]
    paths:
      - 'learning-os/**'
      - '.github/workflows/learning-os-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: learning-os-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/learning-os
          cp learning-os/index.html learning-os/AI_Native_Learning_Operating_System_PRD.md _site/learning-os/
          printf '<meta http-equiv="refresh" content="0;url=learning-os/"><a href="learning-os/">Open LearningOS</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
